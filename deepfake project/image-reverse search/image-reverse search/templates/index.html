<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Image Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🔍 Reverse Image Search</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="upload-box p-4 shadow-lg">
            <h2 class="text-center mb-3">Upload an Image</h2>
            <form id="upload-form" enctype="multipart/form-data">
                <input type="file" id="image-input" accept="image/*" class="form-control mb-3" required>
                <button type="submit" class="btn btn-primary w-100">🔎 Search</button>
            </form>

            <div class="preview mt-4 d-none">
                <img id="uploaded-image" src="#" class="img-fluid animated" alt="Uploaded Image">
            </div>
        </div>

        <div id="loading" class="text-center mt-4 d-none">
            <div class="spinner-border text-primary" role="status"></div>
            <p>Searching...</p>
        </div>

        <div id="results-container" class="mt-5">
            <h3 class="text-center text-light">Search Results</h3>
            <div id="google-results" class="row justify-content-center mt-3"></div>
        </div>
    </div>

    <script src="static/script.js"></script>
</body>
</html>
